name: Assemble watch-atlas JS
on:
  push:
    paths:
      - 'static/watch-atlas/assets/.assemble/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble JS from parts
        run: |
          set -euo pipefail
          PARTS_DIR=static/watch-atlas/assets/.assemble
          OUT=static/watch-atlas/assets/index-4_b-VufC.js
          if [ ! -d "$PARTS_DIR" ]; then
            echo "No parts directory; nothing to do"
            exit 0
          fi
          # Wait until all 18 parts are present (avoid racing partial pushes)
          count=$(ls "$PARTS_DIR"/part*.txt 2>/dev/null | wc -l)
          echo "Found $count parts"
          if [ "$count" -lt 18 ]; then
            echo "Not all parts uploaded yet; skipping assemble"
            exit 0
          fi
          cat "$PARTS_DIR"/part00.txt "$PARTS_DIR"/part01.txt "$PARTS_DIR"/part02.txt \
              "$PARTS_DIR"/part03.txt "$PARTS_DIR"/part04.txt "$PARTS_DIR"/part05.txt \
              "$PARTS_DIR"/part06.txt "$PARTS_DIR"/part07.txt "$PARTS_DIR"/part08.txt \
              "$PARTS_DIR"/part09.txt "$PARTS_DIR"/part10.txt "$PARTS_DIR"/part11.txt \
              "$PARTS_DIR"/part12.txt "$PARTS_DIR"/part13.txt "$PARTS_DIR"/part14.txt \
              "$PARTS_DIR"/part15.txt "$PARTS_DIR"/part16.txt "$PARTS_DIR"/part17.txt > "$OUT"
          rm -rf "$PARTS_DIR"
          git config user.name "mikeornstein"
          git config user.email "10444033+mikeornstein@users.noreply.github.com"
          git add -A
          git commit -m "Assemble Watch Atlas motion polish JS from parts" || exit 0
          git push
