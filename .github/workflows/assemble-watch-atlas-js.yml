name: Assemble watch-atlas JS
on:
  push:
    paths:
      - 'static/watch-atlas/assets/.assemble/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble JS from gzip+base64 parts
        run: |
          set -euo pipefail
          PARTS_DIR=static/watch-atlas/assets/.assemble
          OUT=static/watch-atlas/assets/index-4_b-VufC.js
          count=$(ls "$PARTS_DIR"/gz*.b64 2>/dev/null | wc -l)
          echo "Found $count gz parts"
          expected=6
          if [ "$count" -lt "$expected" ]; then
            echo "Not all parts uploaded yet; skipping"
            exit 0
          fi
          cat "$PARTS_DIR"/gz*.b64 | base64 -d | gzip -d > "$OUT"
          python3 - <<'PY'
          import hashlib, pathlib
          data = pathlib.Path("static/watch-atlas/assets/index-4_b-VufC.js").read_bytes()
          print("assembled", len(data), hashlib.md5(data).hexdigest())
          assert hashlib.md5(data).hexdigest() == "0d206624af4a51345ae0a0e0694f9502"
          PY
          rm -rf "$PARTS_DIR"
          git config user.name "mikeornstein"
          git config user.email "10444033+mikeornstein@users.noreply.github.com"
          git add -A
          git commit -m "Assemble Watch Atlas motion polish JS from parts" || exit 0
          git push
