name: import-hydro-flow-js
on:
  push:
    branches: ["cursor/add-hydro-flow-toy-dd9a"]
    paths:
      - ".github/workflows/import-hydro-flow-js.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import JS asset
        run: |
          set -euo pipefail
          mkdir -p static/hydro-flow/assets
          curl -fsSL -o static/hydro-flow/assets/index-Dm4FU8Z2.js \
            https://raw.githubusercontent.com/mikeornstein/hydro-flow/18a53593b33c1c7a9d22d514c6767c8cb8225897/site/assets/index-Dm4FU8Z2.js
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          data = Path("static/hydro-flow/assets/index-Dm4FU8Z2.js").read_bytes()
          digest = sha256(data).hexdigest()
          if len(data) != 418434:
              raise SystemExit(f"size {len(data)}")
          if digest != "c179dd25e95310e1d82856f8971c14c615622f31f7b06d4471558bfb580a5d0b":
              raise SystemExit(f"sha256 {digest}")
          print("ok", len(data), digest)
          PY
          rm -f static/hydro-flow/assets/_mcp-probe.js
          rm -f .github/workflows/import-hydro-flow-js.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/hydro-flow/assets/index-Dm4FU8Z2.js
          git add -u static/hydro-flow/assets/_mcp-probe.js .github/workflows/import-hydro-flow-js.yml || true
          git commit -m "feat(toys): add hydro-flow JS asset"
          git push
