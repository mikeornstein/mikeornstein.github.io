<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Watch Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--paper:#f3ece1;--gold:#c4a574;--mute:#8a8074;--line:rgba(243,236,225,.14)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080808;color:var(--paper);font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0}
#c3d{width:100%;height:100%;display:block}
.brand{position:absolute;left:22px;top:18px;z-index:2}
.brand .eyebrow{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:var(--gold);margin:0}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:36px;margin:4px 0 0;line-height:.95}
.legend{position:absolute;top:22px;right:22px;font-size:12px;color:var(--mute);text-align:right;z-index:2}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.hud{position:absolute;left:22px;bottom:18px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
.hud button,.hud span{border:1px solid var(--line);background:#0b0b0ccc;color:inherit;padding:7px 11px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.sheet{position:absolute;right:18px;bottom:18px;width:min(340px,calc(100vw - 36px));max-height:min(62vh,560px);overflow:auto;background:#0e0c0af2;border:1px solid var(--line);padding:16px;z-index:2;backdrop-filter:blur(10px)}
.sheet img{width:100%;height:160px;object-fit:contain;background:#14110e;margin:8px 0}
h2{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;margin:0;line-height:1.05}
h2 em{display:block;font-style:italic;font-weight:400}
.note{color:#cfc6b8;font-size:13px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:12px 0}
.specs dt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.specs dd{margin:2px 0 0;font-size:13px}
.row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.chip{flex:0 0 92px;border:1px solid var(--line);background:transparent;color:inherit;padding:0;cursor:pointer;text-align:left}
.chip img{width:100%;height:64px;object-fit:contain;display:block;background:#14110e}
.chip em{display:block;font-style:normal;font-size:10px;padding:5px 6px 7px}
.chip.on{outline:1px solid var(--gold)}
</style>
</head>
<body>
<div class="stage">
  <canvas id="c3d"></canvas>
  <header class="brand"><p class="eyebrow">mikeornstein.com · toys</p><h1>Watch Atlas</h1></header>
  <div class="legend" id="legend"></div>
  <div class="hud">
    <button id="all">all watches</button>
    <span>click a watch to enter its neighborhood</span>
  </div>
  <aside class="sheet" id="sheet"></aside>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const commons = (file) => `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(file)}`;
const W = [
  {id:'sub-126610ln',brand:'Rolex',model:'Submariner Date',reference:'126610LN',diameter:41,thickness:12.3,crystal:'flat sapphire',caseShape:'round',dialColor:'black',dialFinish:'matte',indices:'applied mercedes',hands:'mercedes',bezelFunction:'elapsed dive',bezelMaterial:'ceramic',braceletType:'oyster 3-link',complications:['date'],cluster:'dive homage',priceUsd:11350,image:commons('Rolex Submariner diving watch.jpg'),note:'Ceramic-bezel Sub. Anchor vector.'},
  {id:'sub-16610',brand:'Rolex',model:'Submariner Date',reference:'16610',diameter:40,thickness:13,crystal:'flat sapphire',caseShape:'round',dialColor:'black',dialFinish:'matte',indices:'applied mercedes',hands:'mercedes',bezelFunction:'elapsed dive',bezelMaterial:'aluminum',braceletType:'oyster 3-link',complications:['date'],cluster:'dive homage',priceUsd:9800,image:commons('Rolex-Submariner.jpg'),note:'Five-digit Sub. Aluminum insert.'},
  {id:'steinhart-o39',brand:'Steinhart',model:'Ocean One 39',reference:'O39-BLK',diameter:39,thickness:12.5,crystal:'flat sapphire',caseShape:'round',dialColor:'black',dialFinish:'matte',indices:'applied mercedes',hands:'mercedes',bezelFunction:'elapsed dive',bezelMaterial:'ceramic',braceletType:'oyster 3-link',complications:['date'],cluster:'dive homage',priceUsd:535,image:commons('Rolex Submariner diving watch.jpg'),note:'Homage geometry. Same bezel job.'},
  {id:'sanmartin-sn0121',brand:'San Martin',model:'SN0121G',reference:'SN0121G',diameter:40,thickness:13.2,crystal:'flat sapphire',caseShape:'round',dialColor:'black',dialFinish:'matte',indices:'applied mercedes',hands:'mercedes',bezelFunction:'elapsed dive',bezelMaterial:'ceramic',braceletType:'oyster 3-link',complications:['date'],cluster:'dive homage',priceUsd:289,image:commons('Rolex-Submariner.jpg'),note:'Geometry homage.'},
  {id:'pagani-pd1661',brand:'Pagani Design',model:'PD-1661',reference:'PD-1661',diameter:40,thickness:13.5,crystal:'flat sapphire',caseShape:'round',dialColor:'black',dialFinish:'matte',indices:'applied mercedes',hands:'mercedes',bezelFunction:'elapsed dive',bezelMaterial:'ceramic',braceletType:'oyster 3-link',complications:['date'],cluster:'dive homage',priceUsd:129,image:commons('Rolex-Submariner.jpg'),note:'Cheap homage. Kit still matches.'},
  {id:'tudor-bb58',brand:'Tudor',model:'Black Bay Fifty-Eight',reference:'M79030N',diameter:39,thickness:11.9,crystal:'domed sapphire',caseShape:'round',dialColor:'black',dialFinish:'matte',indices:'applied mercedes',hands:'snowflake',bezelFunction:'elapsed dive',bezelMaterial:'aluminum',braceletType:'bracelet other',complications:[],cluster:'dive homage',priceUsd:3750,image:commons('Rolex Submariner diving watch.jpg'),note:'Dive neighbor. Snowflake + dome.'},
  {id:'seiko-skx007',brand:'Seiko',model:'SKX007',reference:'SKX007',diameter:42,thickness:13.4,crystal:'acrylic',caseShape:'round',dialColor:'black',dialFinish:'textured',indices:'applied baton',hands:'sword',bezelFunction:'elapsed dive',bezelMaterial:'aluminum',braceletType:'bracelet other',complications:['date'],cluster:'dive homage',priceUsd:280,image:commons('Rolex Submariner diving watch.jpg'),note:'Same job, different kit.'},
  {id:'omega-smp300',brand:'Omega',model:'Seamaster Diver 300M',reference:'210.30.42.20.01.001',diameter:42,thickness:13.6,crystal:'domed sapphire',caseShape:'round',dialColor:'black',dialFinish:'textured',indices:'applied baton',hands:'sword',bezelFunction:'elapsed dive',bezelMaterial:'ceramic',braceletType:'bracelet other',complications:['date'],cluster:'dive homage',priceUsd:5400,image:commons('Rolex Submariner diving watch.jpg'),note:'Peer diver, not a clone.'},
  {id:'omega-speedy',brand:'Omega',model:'Speedmaster Professional',reference:'310.30.42.50.01.001',diameter:42,thickness:13.2,crystal:'domed sapphire',caseShape:'round',dialColor:'black',dialFinish:'matte',indices:'applied baton',hands:'chrono baton',bezelFunction:'tachymeter',bezelMaterial:'aluminum',braceletType:'bracelet other',complications:['chronograph'],cluster:'tool chrono',priceUsd:7400,image:commons('OMEGA-Speedmaster-Professional-Front.jpg'),note:'Tachymeter + chrono leave the dive neighborhood.'},
  {id:'rolex-daytona',brand:'Rolex',model:'Daytona',reference:'126500LN',diameter:40,thickness:12.2,crystal:'flat sapphire',caseShape:'round',dialColor:'white',dialFinish:'gloss',indices:'applied baton',hands:'chrono baton',bezelFunction:'tachymeter',bezelMaterial:'ceramic',braceletType:'oyster 3-link',complications:['chronograph'],cluster:'tool chrono',priceUsd:14900,image:commons('OMEGA-Speedmaster-Professional-Front.jpg'),note:'Same house, different sport.'},
  {id:'nomos-tangente',brand:'Nomos',model:'Tangente 38',reference:'164',diameter:37.5,thickness:6.7,crystal:'domed sapphire',caseShape:'round',dialColor:'white',dialFinish:'matte',indices:'printed arabic',hands:'leaf',bezelFunction:'none',bezelMaterial:'steel',braceletType:'leather',complications:[],cluster:'dress dome',priceUsd:1960,image:commons('NOMOS Glashütte Tangente.jpg'),note:'Thin, no bezel.'},
  {id:'panerai-luminor',brand:'Panerai',model:'Luminor Marina',reference:'PAM01312',diameter:44,thickness:13.2,crystal:'flat sapphire',caseShape:'cushion',dialColor:'black',dialFinish:'matte',indices:'mixed',hands:'sword',bezelFunction:'none',bezelMaterial:'steel',braceletType:'leather',complications:['date'],cluster:'dive homage',priceUsd:5900,image:commons('NOMOS Glashütte Tangente.jpg'),note:'Cushion case. Out of homage space.'},
];
const COLORS={'dive homage':0xc4a574,'tool chrono':0x7aa2c4,'dress dome':0xd9c7a3};
const code={crystal:{'flat sapphire':1,'domed sapphire':.45,acrylic:0},case:{round:1,cushion:.45},bezel:{'elapsed dive':1,tachymeter:.2,none:0},bezM:{ceramic:1,aluminum:.7,steel:.5},brace:{'oyster 3-link':1,'bracelet other':.55,leather:.1},hands:{mercedes:1,snowflake:.55,sword:.45,'chrono baton':.2,leaf:.1}};
function vec(w){return [w.diameter/50,w.thickness/16,(code.crystal[w.crystal]||0)*1.6,(code.case[w.caseShape]||0)*1.3,(code.bezel[w.bezelFunction]||0)*1.6,(code.bezM[w.bezelMaterial]||0)*1.4,(code.brace[w.braceletType]||0)*1.3,(code.hands[w.hands]||0)*1.2,w.complications.includes('chronograph')?1.4:0,Math.log10(w.priceUsd)/5*.35];}
function cos(a,b){let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return d/Math.sqrt(na*nb);}
function pca3(vecs){
  const n=vecs.length,d=vecs[0].length,mean=Array(d).fill(0);
  vecs.forEach(v=>v.forEach((x,i)=>mean[i]+=x/n));
  const X=vecs.map(v=>v.map((x,i)=>x-mean[i]));
  const axes=[]; const XtX=v=>{const o=Array(d).fill(0); for(const row of X){const dot=row.reduce((s,x,i)=>s+x*v[i],0); row.forEach((x,i)=>o[i]+=x*dot);} return o;};
  const norm=v=>{const n=Math.sqrt(v.reduce((s,x)=>s+x*x,0))||1; return v.map(x=>x/n);};
  for(let k=0;k<3;k++){ let v=norm(Array.from({length:d},()=>Math.random())); for(let it=0;it<50;it++){ let w=XtX(v); axes.forEach(a=>{const p=w.reduce((s,x,i)=>s+x*a[i],0); w=w.map((x,i)=>x-p*a[i]);}); v=norm(w);} axes.push(v); }
  return X.map(row=>axes.map(a=>row.reduce((s,x,i)=>s+x*a[i],0)));
}
function mst(n,score){const used=new Set([0]),edges=[]; while(used.size<n){let best=null; for(const a of used) for(let b=0;b<n;b++) if(!used.has(b)){const s=score(a,b); if(!best||s>best.s) best={a,b,s};} used.add(best.b); edges.push(best);} return edges;}
function neighbors(i,k=4){return W.map((_,j)=>({j,s:i===j?-1:cos(V[i],V[j])})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).slice(0,k);}

const V=W.map(vec);
const P=pca3(V).map(p=>new THREE.Vector3(p[0]*9,p[1]*9,p[2]*9));
const tree=mst(W.length,(i,j)=>cos(V[i],V[j]));

const canvas=document.getElementById('c3d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,1,.1,200);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,.55));
const key=new THREE.DirectionalLight(0xffe6c0,.75); key.position.set(8,12,6); scene.add(key);

const nodes=[], sprites=[];
W.forEach((w,i)=>{
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(.42,24,24), new THREE.MeshStandardMaterial({color:COLORS[w.cluster],roughness:.35,metalness:.25}));
  mesh.position.copy(P[i]); mesh.userData.i=i; scene.add(mesh); nodes.push(mesh);
  const loader=new THREE.TextureLoader(); loader.crossOrigin='anonymous';
  loader.load(w.image, tex=>{ tex.colorSpace=THREE.SRGBColorSpace; const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true})); spr.position.copy(P[i]).add(new THREE.Vector3(0,1.05,0)); spr.scale.set(1.7,1.7,1); spr.userData.i=i; scene.add(spr); sprites.push(spr); });
});
const linePos=[]; tree.forEach(e=>{linePos.push(P[e.a].x,P[e.a].y,P[e.a].z,P[e.b].x,P[e.b].y,P[e.b].z);});
const lg=new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(linePos,3));
const lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x6a5a45,transparent:true,opacity:.5}));
scene.add(lines);

let sel=null, mode='all';
const camFrom=new THREE.Vector3(), camTo=new THREE.Vector3(), tgtFrom=new THREE.Vector3(), tgtTo=new THREE.Vector3();
let fly=0;
function fit(indices, tight){
  const box=new THREE.Box3();
  indices.forEach(i=>box.expandByPoint(P[i]));
  const c=box.getCenter(new THREE.Vector3());
  const size=Math.max(box.getSize(new THREE.Vector3()).length(), tight?3.2:8);
  const dist=size*(tight?1.35:1.7);
  camFrom.copy(camera.position); tgtFrom.copy(controls.target);
  tgtTo.copy(c);
  const dir=camera.position.clone().sub(controls.target).normalize();
  if(dir.lengthSq()<.01) dir.set(0.6,0.45,1).normalize();
  camTo.copy(c).addScaledVector(dir, dist);
  fly=1;
}
function enter(i){
  sel=i; mode='hood';
  const hood=[i,...neighbors(i,4).map(n=>n.j)];
  fit(hood,true); paint();
}
function showAll(){ sel=null; mode='all'; fit(W.map((_,i)=>i), false); paint(); }

const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
canvas.addEventListener('click',ev=>{
  const r=canvas.getBoundingClientRect();
  mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(nodes)[0];
  if(hit) enter(hit.object.userData.i);
});
document.getElementById('all').onclick=showAll;

function resize(){ const r=canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(r.height,1); camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

function paint(){
  const s = sel==null ? W[0] : W[sel];
  const near = sel==null ? [] : neighbors(sel,5);
  const hood = new Set(sel==null ? W.map((_,i)=>i) : [sel,...near.map(n=>n.j)]);
  nodes.forEach((m,i)=>{
    const on=hood.has(i);
    m.visible=true;
    m.material.opacity=on?1:.18; m.material.transparent=true;
    m.scale.setScalar(i===sel?1.55: on?1:.55);
  });
  sprites.forEach(sp=>{ const i=sp.userData.i; const on=hood.has(i); sp.material.opacity=on?1:.12; sp.scale.set(on?(i===sel?2.2:1.7):.7, on?(i===sel?2.2:1.7):.7,1); });
  document.getElementById('sheet').innerHTML = sel==null ? `
    <p class="eyebrow" style="letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--gold)">full map</p>
    <p class="note">Click any node to zoom into its neighborhood. Distant watches dim.</p>
    <div class="row">${W.map((w,i)=>`<button class="chip" data-i="${i}"><img src="${w.image}"/><em>${w.brand}</em></button>`).join('')}</div>` : `
    <p style="letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--gold);margin:0">neighborhood</p>
    <img src="${s.image}" alt=""/>
    <h2>${s.brand}<em>${s.model}</em></h2>
    <p class="note">${s.note}</p>
    <dl class="specs">
      <div><dt>Case</dt><dd>${s.caseShape} · ${s.diameter}×${s.thickness}</dd></div>
      <div><dt>Crystal</dt><dd>${s.crystal}</dd></div>
      <div><dt>Bezel</dt><dd>${s.bezelFunction} · ${s.bezelMaterial}</dd></div>
      <div><dt>Hands</dt><dd>${s.hands}</dd></div>
    </dl>
    <p style="letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--gold)">step to a neighbor</p>
    <div class="row">${near.map(n=>`<button class="chip" data-i="${n.j}"><img src="${W[n.j].image}"/><em>${W[n.j].brand} ${(n.s*100).toFixed(0)}</em></button>`).join('')}</div>`;
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>enter(+b.dataset.i));
  document.getElementById('legend').innerHTML=Object.entries(COLORS).map(([k,c])=>`<div><span class="dot" style="background:#${c.toString(16).padStart(6,'0')}"></span>${k}</div>`).join('');
}

camera.position.set(12,8,16); controls.target.set(0,0,0); paint();
(function loop(){
  if(fly>0){
    fly=Math.max(0,fly-0.035);
    const t=1-Math.pow(fly,3);
    camera.position.lerpVectors(camFrom,camTo,t);
    controls.target.lerpVectors(tgtFrom,tgtTo,t);
  }
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);
})();
</script>
</body></html>
