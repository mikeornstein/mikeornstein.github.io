<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Go Momo Go — web prototype</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1 class="visually-hidden">Go Momo Go</h1>

    <div class="device">
      <div class="crank" aria-hidden="true"></div>
      <div class="bezel">
        <canvas id="game" width="400" height="240" tabindex="0" role="img" aria-label="Go Momo Go 400 by 240 game"></canvas>
      </div>
      <div class="controls">
        <div class="dpad" aria-label="D-pad">
          <button type="button" data-dir="u" aria-label="Up">▲</button>
          <button type="button" data-dir="l" aria-label="Left">◀</button>
          <button type="button" data-dir="r" aria-label="Right">▶</button>
          <button type="button" data-dir="d" aria-label="Down">▼</button>
        </div>
        <div class="faces">
          <button type="button" class="face" data-action="restart" aria-label="Restart this block" title="Restart this block">A</button>
          <button type="button" class="face" data-action="new-block" aria-label="New neighborhood" title="New neighborhood">B</button>
        </div>
      </div>
    </div>

    <script src="js/rng.js"></script>
    <script src="js/map.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
