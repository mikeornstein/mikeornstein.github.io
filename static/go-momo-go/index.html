<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>Go Momo Go — web prototype</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body oncontextmenu="return false;">
    <h1 class="visually-hidden">Go Momo Go</h1>

    <div class="device">
      <div class="bezel">
        <canvas id="game" width="400" height="240" tabindex="0" role="img" aria-label="Go Momo Go 400 by 240 game"></canvas>
      </div>
      <div class="controls">
        <div class="dpad" role="group" aria-label="D-pad">
          <button type="button" data-dir="u" aria-label="Up" draggable="false" unselectable="on"></button>
          <button type="button" data-dir="l" aria-label="Left" draggable="false" unselectable="on"></button>
          <button type="button" data-dir="r" aria-label="Right" draggable="false" unselectable="on"></button>
          <button type="button" data-dir="d" aria-label="Down" draggable="false" unselectable="on"></button>
        </div>
        <button type="button" class="menu-btn" data-action="menu" aria-label="Start or pause" draggable="false" unselectable="on"></button>
        <div class="faces">
          <button type="button" class="face face-a" data-action="restart" aria-label="Continue" draggable="false" unselectable="on"></button>
          <button type="button" class="face face-b" data-action="new-block" aria-label="New neighborhood" draggable="false" unselectable="on"></button>
        </div>
      </div>
    </div>

    <script src="js/rng.js"></script>
    <script src="js/map.js"></script>
    <script src="js/dither.js"></script>
    <script src="js/art.js"></script>
    <script src="js/font.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
