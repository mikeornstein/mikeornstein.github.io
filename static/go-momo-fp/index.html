<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Go Momo Go</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1714; overflow: hidden; touch-action: none; }
  body { position: fixed; inset: 0; overscroll-behavior: none; }
  #wrap { height: 100dvh; height: 100%; display: flex; flex-direction: column; }
  #lcdWrap {
    flex: 2 1 0; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: #c9d63a; padding: env(safe-area-inset-top, 0) 0 0;
  }
  #lcd { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
  #shelf {
    flex: 1 1 0; min-height: 0; position: relative;
    background: #1a1714;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0));
  }
  #crank {
    position: absolute; right: max(16px, env(safe-area-inset-right, 0));
    bottom: max(20px, env(safe-area-inset-bottom, 12px));
    width: 72px; height: 72px; touch-action: none; user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="lcdWrap"><canvas id="lcd" width="400" height="240"></canvas></div>
  <div id="shelf"><canvas id="crank" width="136" height="136"></canvas></div>
</div>
<script>
(() => {
  const LCD_W = 400, LCD_H = 240;
  const LIME = "#c9d63a", INK = "#2a1c12";
  const lcd = document.getElementById("lcd");
  const lctx = lcd.getContext("2d");
  const crankEl = document.getElementById("crank");
  const cctx = crankEl.getContext("2d");

  function scaleLcd() {
    const box = document.getElementById("lcdWrap").getBoundingClientRect();
    const s = Math.max(1, Math.floor(Math.min(box.width / LCD_W, box.height / LCD_H)));
    lcd.style.width = (LCD_W * s) + "px";
    lcd.style.height = (LCD_H * s) + "px";
  }
  addEventListener("resize", scaleLcd);
  scaleLcd();

  const you = { x: 0, y: 0, heading: 0 };
  const momoOff = 1.35;
  const crank = { ang: 0, vel: 0, grabbing: false, last: null };
  const look = { dragging: false, lastX: 0 };
  let mail = 0, sniff = 0, gait = 0, wag = 0, tPrev = performance.now();

  const posts = [];
  for (let i = 0; i < 28; i++) {
    const a = i * 1.7;
    posts.push({
      x: Math.cos(a) * (6 + (i % 5) * 2.2) + (i % 3) * 0.4,
      y: Math.sin(a) * (6 + (i % 7) * 1.8),
      h: 1.1 + (i % 4) * 0.15,
      hit: 0
    });
  }

  function wrapPi(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  function crankLocal(e, el) {
    const r = el.getBoundingClientRect();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    return { x: t.clientX - r.left - r.width / 2, y: t.clientY - r.top - r.height / 2 };
  }

  function onCrankStart(e) {
    e.preventDefault();
    const p = crankLocal(e, crankEl);
    crank.grabbing = true;
    crank.last = Math.atan2(p.y, p.x);
  }
  function onCrankMove(e) {
    if (!crank.grabbing) return;
    e.preventDefault();
    const p = crankLocal(e, crankEl);
    const a = Math.atan2(p.y, p.x);
    let da = wrapPi(a - crank.last);
    crank.vel = crank.vel * 0.35 + da * 0.65;
    crank.ang += da;
    crank.last = a;
  }
  function onCrankEnd(e) {
    e.preventDefault();
    crank.grabbing = false;
    crank.last = null;
  }
  const cOpts = { passive: false };
  crankEl.addEventListener("touchstart", onCrankStart, cOpts);
  crankEl.addEventListener("touchmove", onCrankMove, cOpts);
  crankEl.addEventListener("touchend", onCrankEnd, cOpts);
  crankEl.addEventListener("touchcancel", onCrankEnd, cOpts);
  crankEl.addEventListener("pointerdown", e => { if (e.pointerType === "touch") return; onCrankStart(e); crankEl.setPointerCapture(e.pointerId); });
  crankEl.addEventListener("pointermove", e => { if (e.pointerType === "touch") return; onCrankMove(e); });
  crankEl.addEventListener("pointerup", e => { if (e.pointerType === "touch") return; onCrankEnd(e); });
  crankEl.addEventListener("wheel", e => {
    e.preventDefault();
    const da = (e.deltaY + e.deltaX) * 0.004;
    crank.vel = crank.vel * 0.3 + da * 0.7;
    crank.ang += da;
  }, cOpts);

  function lcdClient(e) {
    const r = lcd.getBoundingClientRect();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    return t.clientX - r.left;
  }
  function onLookStart(e) {
    e.preventDefault();
    look.dragging = true;
    look.lastX = lcdClient(e);
  }
  function onLookMove(e) {
    if (!look.dragging) return;
    e.preventDefault();
    const x = lcdClient(e);
    you.heading += (x - look.lastX) * 0.008;
    look.lastX = x;
  }
  function onLookEnd(e) {
    e.preventDefault();
    look.dragging = false;
  }
  lcd.addEventListener("touchstart", onLookStart, cOpts);
  lcd.addEventListener("touchmove", onLookMove, cOpts);
  lcd.addEventListener("touchend", onLookEnd, cOpts);
  lcd.addEventListener("touchcancel", onLookEnd, cOpts);
  lcd.addEventListener("pointerdown", e => { if (e.pointerType === "touch") return; onLookStart(e); lcd.setPointerCapture(e.pointerId); });
  lcd.addEventListener("pointermove", e => { if (e.pointerType === "touch") return; onLookMove(e); });
  lcd.addEventListener("pointerup", e => { if (e.pointerType === "touch") return; onLookEnd(e); });

  function worldToCam(wx, wy) {
    const dx = wx - you.x, dy = wy - you.y;
    const c = Math.cos(-you.heading), s = Math.sin(-you.heading);
    return { x: dx * c - dy * s, z: dx * s + dy * c };
  }
  function project(wx, wy) {
    const p = worldToCam(wx, wy);
    if (p.z < 0.35) return null;
    const f = 210;
    return { x: LCD_W * 0.5 + (p.x / p.z) * f, y: 100 + 92 / p.z, z: p.z, s: 70 / p.z };
  }

  function ditherSky() {
    lctx.fillStyle = LIME;
    lctx.fillRect(0, 0, LCD_W, LCD_H);
    lctx.fillStyle = INK;
    for (let y = 0; y < 96; y += 2) {
      const step = 7 + (y >> 3);
      for (let x = (y * 3) % 5; x < LCD_W; x += step) lctx.fillRect(x, y, 1, 1);
    }
    lctx.fillRect(0, 108, LCD_W, 1);
    for (let y = 110; y < LCD_H; y += 5) {
      for (let x = (y * 2) % 9; x < LCD_W; x += 14) lctx.fillRect(x, y, 1, 1);
    }
  }

  function drawPost(p) {
    const pr = project(p.x, p.y);
    if (!pr) return;
    const h = pr.s * p.h * 1.4;
    const x = Math.round(pr.x);
    const y = Math.round(pr.y);
    lctx.fillStyle = INK;
    lctx.fillRect(x, y - h, 2, h);
    lctx.fillRect(x - 4, y - h, 10, 2);
    if (p.hit > 0.2) lctx.fillRect(x + 3, y - h + 6, 6, 5);
  }

  function drawMomo(px, py, sniffAmt) {
    lctx.save();
    lctx.translate(px, py);
    lctx.strokeStyle = INK;
    lctx.fillStyle = LIME;
    lctx.lineWidth = 2;
    lctx.lineJoin = "round";
    lctx.lineCap = "round";
    const walk = Math.sin(gait) * (1 - sniffAmt);
    lctx.beginPath();
    lctx.moveTo(-7, 4); lctx.lineTo(-9 - walk * 3, 16);
    lctx.moveTo(7, 4); lctx.lineTo(9 + walk * 3, 16);
    lctx.stroke();
    lctx.beginPath();
    lctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2);
    lctx.fill(); lctx.stroke();
    lctx.beginPath();
    lctx.ellipse(-6, -11, 5, 7, -0.3, 0, Math.PI * 2);
    lctx.fill(); lctx.stroke();
    lctx.beginPath();
    lctx.ellipse(6, -11, 5, 7, 0.3, 0, Math.PI * 2);
    lctx.fill(); lctx.stroke();
    lctx.fillStyle = INK;
    lctx.fillRect(-4, -3, 2, 2);
    lctx.fillRect(3, -3, 2, 2);
    lctx.strokeStyle = INK;
    lctx.beginPath();
    lctx.moveTo(0, 8);
    lctx.quadraticCurveTo(Math.sin(wag) * 8, 16, Math.cos(wag) * 4, 18);
    lctx.stroke();
    lctx.restore();
  }

  function drawCrank() {
    const w = crankEl.width, h = crankEl.height, cx = w / 2, cy = h / 2, r = w * 0.42;
    cctx.clearRect(0, 0, w, h);
    cctx.beginPath(); cctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
    cctx.fillStyle = "#2a241e"; cctx.fill();
    cctx.beginPath(); cctx.arc(cx, cy, r, 0, Math.PI * 2);
    cctx.strokeStyle = "#c9a36a"; cctx.lineWidth = 4; cctx.stroke();
    cctx.save();
    cctx.translate(cx, cy);
    cctx.rotate(crank.ang);
    cctx.fillStyle = "#e8c48a";
    cctx.beginPath();
    cctx.roundRect(-6, -7, r * 0.95, 14, 7);
    cctx.fill();
    cctx.beginPath(); cctx.arc(r * 0.88, 0, 12, 0, Math.PI * 2); cctx.fill();
    cctx.fillStyle = INK;
    cctx.beginPath(); cctx.arc(0, 0, 6, 0, Math.PI * 2); cctx.fill();
    cctx.restore();
  }

  function step(dt) {
    if (!crank.grabbing) crank.vel *= Math.exp(-dt * 2.2);
    crank.ang += crank.grabbing ? 0 : crank.vel;
    const speed = Math.abs(crank.vel) * 9.5;
    you.x += Math.cos(you.heading) * speed * dt * 4.2;
    you.y += Math.sin(you.heading) * speed * dt * 4.2;
    gait += speed * dt * 14;
    wag += dt * (1.5 + speed * 6);
    sniff += ((speed < 0.12 ? 1 : 0) - sniff) * (1 - Math.exp(-dt * 5));
    const mx = you.x + Math.cos(you.heading) * momoOff;
    const my = you.y + Math.sin(you.heading) * momoOff;
    for (const p of posts) {
      const d = Math.hypot(p.x - mx, p.y - my);
      if (d < 0.85 && sniff > 0.75 && p.hit < 0.25) { p.hit = 1; mail++; }
      p.hit *= Math.exp(-dt * 0.3);
    }
  }

  function drawWorld() {
    ditherSky();
    const ordered = posts
      .map(p => ({ p, z: worldToCam(p.x, p.y).z }))
      .filter(o => o.z > 0.4)
      .sort((a, b) => b.z - a.z);
    for (const o of ordered) drawPost(o.p);
    const mx = you.x + Math.cos(you.heading) * momoOff;
    const my = you.y + Math.sin(you.heading) * momoOff;
    const mp = project(mx, my) || { x: LCD_W * 0.5, y: 172, z: momoOff };
    const collarX = Math.round(mp.x);
    const collarY = Math.round(mp.y - 4);
    lctx.strokeStyle = INK;
    lctx.lineWidth = 2;
    lctx.beginPath();
    lctx.moveTo(LCD_W * 0.5, LCD_H - 2);
    lctx.lineTo(collarX, collarY);
    lctx.stroke();
    lctx.save(); lctx.translate(collarX, Math.min(LCD_H - 28, collarY + 8 + sniff * 4)); lctx.scale(1.35, 1.35); lctx.translate(-collarX, -(collarY + 8)); drawMomo(collarX, collarY + 8, sniff); lctx.restore();
    lctx.fillStyle = INK;
    lctx.font = "10px ui-monospace, ui-rounded, system-ui";
    lctx.fillText("PEE-MAIL " + mail, 8, 14);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - tPrev) / 1000);
    tPrev = now;
    step(dt);
    drawWorld();
    drawCrank();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
