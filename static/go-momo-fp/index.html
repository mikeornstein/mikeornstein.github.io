<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Go Momo Go</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1714; overflow: hidden; touch-action: none; }
  body { position: fixed; inset: 0; overscroll-behavior: none; }
  #wrap { height: 100dvh; height: 100%; display: flex; flex-direction: column; }
  #lcdWrap {
    flex: 1 1 0;
    min-height: 0;
    background: #c9d63a;
    padding-top: env(safe-area-inset-top, 0);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
  }
  #lcd {
    display: block;
    width: auto;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #shelf {
    flex: 0 0 auto;
    position: relative;
    height: calc(128px + 24px + env(safe-area-inset-bottom, 0px));
    background: #1a1714;
  }
  #stick, #crank {
    position: absolute;
    bottom: max(12px, env(safe-area-inset-bottom, 12px));
    width: 128px; height: 128px;
    touch-action: none; user-select: none;
  }
  #stick { left: max(12px, env(safe-area-inset-left, 0)); }
  #crank { right: max(12px, env(safe-area-inset-right, 0)); }
  .chip {
    position: absolute;
    left: max(12px, env(safe-area-inset-left, 0));
    width: 56px; height: 28px;
    border: 2px solid #6b5b46;
    border-radius: 14px;
    background: #2a241e;
    color: #e8c48a;
    font: 700 11px/24px ui-rounded, system-ui, sans-serif;
    letter-spacing: 0.04em;
    text-align: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    padding: 0;
    margin: 0;
  }
  .chip:active, .chip.on { background: #c9a36a; color: #2a1c12; border-color: #e8c48a; }
  #btnCome { bottom: calc(128px + 14px + env(safe-area-inset-bottom, 0px)); }
  #btnBag { bottom: calc(128px + 14px + env(safe-area-inset-bottom, 0px)); left: calc(max(12px, env(safe-area-inset-left, 0)) + 64px); }
</style>
</head>
<body>
<div id="wrap">
  <div id="lcdWrap"><canvas id="lcd" width="400" height="240"></canvas></div>
  <div id="shelf">
    <canvas id="stick" width="256" height="256"></canvas>
    <button type="button" class="chip" id="btnCome">COME</button>
    <button type="button" class="chip" id="btnBag">BAG</button>
    <canvas id="crank" width="256" height="256"></canvas>
  </div>
</div>
<script src="game.js?v=walk1c"></script>
</body>
</html>
