<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Go Momo Go</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1714; overflow: hidden; touch-action: none; }
  body { position: fixed; inset: 0; overscroll-behavior: none; }
  #wrap { height: 100dvh; height: 100%; display: flex; flex-direction: column; }
  #lcdWrap {
    flex: 0 0 auto;
    background: #c9d63a;
    padding-top: env(safe-area-inset-top, 0);
    line-height: 0;
  }
  #lcd {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 400 / 240;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #shelf {
    flex: 1 1 0; min-height: 0; position: relative;
    background: #1a1714;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0));
  }
  #stick {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0));
    bottom: max(16px, env(safe-area-inset-bottom, 12px));
    width: 132px; height: 132px; touch-action: none; user-select: none;
  }
  #crank {
    position: absolute; right: max(12px, env(safe-area-inset-right, 0));
    bottom: max(16px, env(safe-area-inset-bottom, 12px));
    width: 96px; height: 96px; touch-action: none; user-select: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="lcdWrap"><canvas id="lcd" width="400" height="240"></canvas></div>
  <div id="shelf">
    <canvas id="stick" width="264" height="264"></canvas>
    <canvas id="crank" width="192" height="192"></canvas>
  </div>
</div>
<script src="game.js?v=stick1"></script>
</body>
</html>
